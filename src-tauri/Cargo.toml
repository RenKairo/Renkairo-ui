[package]
name = "renkairo-ide"
version = "1.0.0"
description = "RenKairo IDE - Next-Gen Cloud & AI Engineering Canvas"
authors = ["RenKairo Architecture Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
